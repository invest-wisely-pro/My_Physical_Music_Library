<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlante della Musica</title>
<meta name="theme-color" content="#101417">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:'Inter Atlante'; src:url('fonts/inter-var.woff2') format('woff2'); font-weight:100 900; font-display:swap;}   /* Inter, SIL Open Font License: fonts/OFL.txt */
:root{
  --ink:#101417; --s1:#161C20; --s2:#1D252A; --s3:#26313A; --line:#2B3740;
  --paper:#ECE7DC; --paper2:#B8B3A8; --paper3:#857F74;
  --acc:#4FD1A5; --acc2:#2E9C7A; --amber:#E9A23B; --amber2:#F5C26B;
  --ui:-apple-system, BlinkMacSystemFont, 'Inter Atlante', 'Segoe UI', Roboto, Arial, sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0; background:var(--ink); color:var(--paper); font-family:var(--ui); -webkit-font-smoothing:antialiased; letter-spacing:-0.003em;}
body{padding-bottom:env(safe-area-inset-bottom,0px);}
a{color:inherit; text-decoration:none;}
button{font:inherit; color:inherit;}
.top{position:sticky; top:0; z-index:5; background:rgba(16,20,23,.9); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line); padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,4vw) 6px;}
.brand{display:inline-flex; align-items:center; gap:10px;} .brand img{width:30px; height:30px; border-radius:8px;}
.brand b{font-size:21px; font-weight:800; letter-spacing:-.025em;}
#q{width:100%; height:42px; margin:10px 0 6px; border-radius:21px; border:1px solid var(--line); background:var(--s1); color:var(--paper); padding:0 16px; font:inherit; font-size:16px; outline:none;}
#q:focus{border-color:var(--acc2);}
.nav{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; margin:0 -6px;} .nav::-webkit-scrollbar{display:none;}
.nav a{padding:8px 13px; border-radius:18px; font-weight:600; color:var(--paper2); white-space:nowrap; font-size:15px;}
.nav a.on{background:var(--s3); color:var(--paper);}
main{position:relative; padding:14px max(16px,4vw) 70px; max-width:1280px; margin:0 auto;}
h1.pg{font-size:31px; font-weight:800; letter-spacing:-.03em; margin:6px 0 6px; line-height:1.08;}
h2.sec{display:flex; align-items:baseline; justify-content:space-between; gap:12px; font-size:21px; font-weight:700; letter-spacing:-.02em; margin:28px 0 12px;}
h2.sec .cnt{color:var(--paper3); font-weight:600; font-size:15px; margin-right:auto; margin-left:8px;}
.more{font-size:14px; font-weight:600; color:var(--acc); white-space:nowrap;}
.lead{color:var(--paper2); margin:0 0 14px; line-height:1.55; max-width:760px;}
.note{color:var(--paper3); font-size:13.5px; line-height:1.55;}
.lbl{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--paper3); margin:18px 0 8px;}
.lnk{color:var(--acc);}
/* copertine */
.strip{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(132px,152px); gap:14px; overflow-x:auto; padding-bottom:8px; scroll-snap-type:x proximity; scrollbar-width:thin;}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:16px 14px;}
.card{display:block; min-width:0; scroll-snap-align:start;}
.cv{position:relative; aspect-ratio:1; border-radius:10px; overflow:hidden; background:var(--tilebg,#26313A); box-shadow:0 6px 18px rgba(0,0,0,.35);}
.cv img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
.cv .ph{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-end; padding:10px; background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(0,0,0,.25));}
.cv .ph span{font-weight:800; font-size:15px; line-height:1.15; letter-spacing:-.015em; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;}
.cv .ph small{color:rgba(236,231,220,.75); font-size:12px; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.cv img ~ .ph{display:none;}
.cv .mk,.cv .own{position:absolute; top:6px; font-style:normal; font-size:12px; font-weight:800; padding:2px 7px; border-radius:9px; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);}
.cv .mk{left:6px; background:rgba(16,20,23,.72); color:var(--amber2);} .cv .own{right:6px; background:rgba(16,20,23,.72); color:var(--acc);}
.card b{display:block; font-size:14px; font-weight:650; margin-top:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-.01em;}
.card small{display:block; color:var(--paper3); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px;}
/* righe */
.rows{display:flex; flex-direction:column;}
.fr{display:grid; grid-template-columns:56px minmax(0,1fr) auto; gap:12px; align-items:center; padding:9px 2px; border-bottom:1px solid var(--line);}
.fr .cv{width:56px; border-radius:6px; box-shadow:none;} .fr .cv .ph,.fr .cv .mk,.fr .cv .own{display:none;}
.fr b{font-weight:650; font-size:15.5px; letter-spacing:-.01em;} .fr .sub{display:block; color:var(--paper3); font-size:13px; margin-top:2px;}
.badges{display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end;}
.bd{font-size:12px; padding:3px 9px; border-radius:10px; background:var(--s3); color:var(--paper2); font-weight:650; white-space:nowrap;}
.bd.mp{background:rgba(233,162,59,.18); color:var(--amber2);} .bd.own{background:rgba(79,209,165,.16); color:var(--acc);} .bd.me{background:rgba(233,162,59,.9); color:#1d1406;}
@media (max-width:560px){ .fr{grid-template-columns:56px minmax(0,1fr);} .fr .badges{grid-column:2; justify-content:flex-start;} }
/* esplora */
.ruler{display:flex; gap:8px; overflow-x:auto; padding:4px 0 6px; scrollbar-width:none;} .ruler::-webkit-scrollbar{display:none;}
.ruler a{flex:none; display:flex; flex-direction:column; align-items:center; gap:5px; min-width:64px; padding:10px 10px 8px; border-radius:14px; background:var(--s1); border:1px solid var(--line);}
.ruler a b{font-size:15px; font-weight:750;} .ruler a i{display:block; width:26px; border-radius:4px; background:linear-gradient(var(--acc),var(--acc2)); min-height:4px;}
.ruler a small{color:var(--paper3); font-size:11.5px;}
.genres{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px;}
.genre{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; padding:14px; border-radius:14px; background:var(--s2); min-height:64px;}
.genre b{font-weight:700; font-size:15.5px; line-height:1.25; letter-spacing:-.01em;} .genre i{font-style:normal; color:var(--paper3); font-size:13px; font-weight:600;}
.chips{display:flex; flex-wrap:wrap; gap:8px;} .chip{padding:7px 12px; border-radius:16px; background:var(--s2); font-size:14px; font-weight:600;}
/* album */
.hero{position:absolute; left:0; right:0; top:0; height:460px; background:center/cover no-repeat; filter:blur(48px) saturate(1.3); opacity:.32; z-index:-1;
  -webkit-mask-image:linear-gradient(#000,transparent); mask-image:linear-gradient(#000,transparent); pointer-events:none;}
.album-head{display:grid; grid-template-columns:minmax(0,300px) minmax(0,1fr); gap:28px; align-items:start; margin-top:8px;}
.album-head > .cv{box-shadow:0 18px 50px rgba(0,0,0,.55);}
.by{font-size:19px; font-weight:650; margin:2px 0 4px;} .meta{color:var(--paper2); margin:0 0 12px;}
@media (max-width:680px){ .album-head{grid-template-columns:1fr; gap:18px;} .album-head > .cv{max-width:320px; width:78%; margin:0 auto;} }
.listen{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; max-width:560px;}
.listen a{display:flex; align-items:center; justify-content:center; gap:8px; height:46px; border-radius:23px; background:var(--s2); border:1px solid var(--line); font-weight:700; font-size:14.5px; text-align:center; padding:0 8px;}
.listen a::before{content:""; width:10px; height:10px; border-radius:50%; background:var(--brand); flex:none;}
.listen a:hover{border-color:var(--brand);}
.acts{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px;}
.btn{display:inline-flex; align-items:center; gap:6px; height:40px; padding:0 16px; border-radius:20px; border:1px solid var(--line); background:var(--s2); color:var(--paper); font-weight:650; font-size:14.5px; cursor:pointer;}
.btn.on{background:var(--acc); color:#06261C; border-color:transparent;} .btn.sm{height:34px; padding:0 12px; font-size:13.5px;}
.rate{display:flex; flex-wrap:wrap; gap:6px;} .rate button{width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:var(--s2); font-weight:700; cursor:pointer;}
.rate button.on{background:var(--amber); color:#1d1406; border-color:transparent;}
.box{background:var(--s1); border:1px solid var(--line); border-radius:14px; margin:18px 0; overflow:hidden;}
.box h3{margin:0; padding:12px 16px; border-bottom:1px solid var(--line); font-size:16px; font-weight:700; letter-spacing:-.01em;} .box .in{padding:12px 16px;}
.plot{line-height:1.65; margin:0 0 8px; font-size:16px;}
.tracks{list-style:none; margin:0; padding:0;} .tracks li{display:grid; grid-template-columns:32px minmax(0,1fr) auto; gap:10px; padding:8px 0; border-bottom:1px solid rgba(255,255,255,.05);}
.tracks .tn{color:var(--paper3); font-variant-numeric:tabular-nums; text-align:right;} .tracks .tl{color:var(--paper3); font-variant-numeric:tabular-nums;}
.tracks .disc{display:block; padding:12px 0 4px; color:var(--paper3); font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.06em; border:0;}
.kv{display:grid; grid-template-columns:max-content minmax(0,1fr); gap:8px 16px; margin:0;} .kv dt{color:var(--paper3);} .kv dd{margin:0;}
/* artista */
.art-head{display:flex; gap:20px; align-items:center; margin-top:8px;}
.ph-art{flex:none; width:112px; height:112px; border-radius:50%; background:var(--s3); display:flex; align-items:center; justify-content:center; font-size:36px; font-weight:800; color:var(--paper3); overflow:hidden; position:relative;}
.ph-art img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
.people{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px;}
.person{display:flex; align-items:center; gap:12px; padding:10px; border-radius:14px; background:var(--s1); border:1px solid var(--line); min-width:0;}
.person .ini{flex:none; width:44px; height:44px; border-radius:50%; background:var(--s3); display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--paper3);}
.person b{display:block; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;} .person small{color:var(--paper3);}
/* moduli */
.filters{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 12px;}
select,input[type=text],input[type=search],textarea{background:var(--s1); color:var(--paper); border:1px solid var(--line); border-radius:10px; font:inherit; font-size:15px; padding:8px 10px;}
select{height:38px;} textarea{width:100%; min-height:140px;}
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 14px;} .tabs a{padding:8px 14px; border-radius:18px; background:var(--s1); border:1px solid var(--line); font-weight:650; font-size:14.5px;} .tabs a.on{background:var(--s3);}
.rk{display:grid; grid-template-columns:30px 48px minmax(0,1fr) auto; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line);}
.rk .n{color:var(--amber2); font-weight:800; text-align:right;} .rk .cv{width:48px; border-radius:5px; box-shadow:none;} .rk .cv .ph{display:none;}
.rk .ctl{display:flex; gap:4px;} .rk .ctl button{width:32px; height:32px; border-radius:8px; border:1px solid var(--line); background:var(--s2); cursor:pointer;}
.hidden{display:none !important;}
#toast{position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--paper); color:#111; padding:10px 16px; border-radius:20px; font-weight:650; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:20; max-width:90vw; text-align:center;}
#toast.on{opacity:1;}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#"><img src="icons/icon-192.png" alt=""><b>Atlante della Musica</b></a>
  <input id="q" type="search" placeholder="Cerca un album o un artista…" autocomplete="off" enterkeyhint="search">
  <nav class="nav" id="nav">
    <a href="#" data-k="">Esplora</a><a href="#lista/capolavori" data-k="capolavori">Capolavori</a><a href="#artisti" data-k="artisti">Artisti</a>
    <a href="#liste" data-k="liste">Le mie liste</a><a href="#classifiche" data-k="classifiche">Classifiche</a><a href="#strumenti" data-k="strumenti">Strumenti</a>
  </nav>
</header>
<main id="view"><p class="note">Apro l'atlante…</p></main>
<div id="toast"></div>
<script>
'use strict';
/* =====================================================================
   Atlante della Musica — legge l'indice dell'app dei dischi (../index.html)
   ===================================================================== */
const APP_VERSION = '1.0';
const $ = id => document.getElementById(id), V = () => $('view');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, ' ').trim();
const uuid = id => id.length === 32 ? `${id.slice(0, 8)}-${id.slice(8, 12)}-${id.slice(12, 16)}-${id.slice(16, 20)}-${id.slice(20)}` : id;
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
const NOW = new Date(), YEAR = NOW.getFullYear(), TODAY = NOW.toISOString().slice(0, 10);
const MESI = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
const fmtD = d => { const m = String(d || '').match(/^(\d{4})-(\d\d)-(\d\d)$/); return m ? `${+m[3]} ${MESI[+m[2] - 1]} ${m[1]}` : String(d || ''); };
const fmtN = n => Number(n || 0).toLocaleString('it-IT');
const dur = ms => { const s = Math.round((ms || 0) / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const durTot = ms => { const m = Math.round((ms || 0) / 60000); return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`; };
function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(()=>el.classList.remove('on'), 2600); }

/* ---------- l'indice ---------- */
let IDX = [], BY_ID = new Map(), ARTISTS = new Map(), GENRES = [], META = { built: '', dump: '' }, RATED = false, MP = new Set(), GEMS = [], OWN = new Map(), TBYT = null;
const TYPES = { L: 'Dal vivo', C: 'Raccolta', S: 'Colonna sonora', R: 'Remix' };
const typeLabel = e => e.ty[0] === 'E' ? 'EP' : (TYPES[e.ty[1]] || 'Album');
const typeKey = e => e.ty[0] === 'E' ? 'ep' : e.ty.length > 1 ? e.ty[1] : 'studio';

async function gunzipB64(b64){
  const bin = atob(b64), u = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}
async function loadIndex(){
  let html;
  try{ const r = await fetch('../index.html', { cache: 'no-cache' }); if(!r.ok) throw new Error('http'); html = await r.text(); }
  catch(e){ const r = await fetch('../index.html', { cache: 'force-cache' }); html = await r.text(); }   // offline: la copia salvata
  const m = html.match(/<script type="text\/plain" id="mbIndexData"([^>]*)>([^<]*)<\/script>/);
  if(!m || !m[2].trim()) throw new Error('noindex');
  META.built = (m[1].match(/data-built="([^"]*)"/) || [])[1] || ''; META.dump = (m[1].match(/data-dump="([^"]*)"/) || [])[1] || '';
  build(await gunzipB64(m[2].trim()));
}
function build(txt){
  IDX = [];
  for(const l of txt.split('\n')){
    if(!l) continue; const p = l.split('|'); if(p.length < 5 || p[0].length !== 32) continue;
    IDX.push({ id: p[0], t: p[1] || '', a: p[2] || '', y: parseInt(p[3], 10) || 0, ty: p[4] || 'A', g: p[5] ? p[5].split(', ').filter(Boolean) : [],
      rv: parseInt(p[6], 10) || 0, vc: parseInt(p[7], 10) || 0, d: p[8] || '', r: IDX.length });   // r: posizione per fama (l'indice è già in ordine)
  }
  BY_ID = new Map(IDX.map(e=>[e.id, e]));
  ARTISTS = new Map();
  for(const e of IDX){ const k = norm(e.a); if(!k) continue; let A = ARTISTS.get(k); if(!A){ A = { name: e.a, k, list: [], fame: 0 }; ARTISTS.set(k, A); } A.list.push(e); A.fame += 1 / Math.sqrt(e.r + 25); }
  const gc = new Map(); for(const e of IDX) for(const g of e.g) gc.set(g, (gc.get(g) || 0) + 1);
  GENRES = [...gc.entries()].filter(x=>x[1] >= 30).sort((a, b)=>b[1] - a[1]).map(([g, n])=>({ g, n }));
  // capolavori: il voto degli utenti di MusicBrainz, pesato su quanti hanno votato. Soglie che si adattano ai dati.
  const rated = IDX.filter(e=>e.vc >= 3 && e.rv); RATED = rated.length >= 200; MP = new Set(); GEMS = [];
  if(RATED){
    const C = rated.reduce((s, e)=>s + e.rv, 0) / rated.length, m = 8;
    for(const e of IDX) e.br = e.vc ? (e.vc * e.rv + m * C) / (e.vc + m) : 0;
    const pool = IDX.filter(e=>e.vc >= 10).sort((a, b)=>b.br - a.br || a.r - b.r);
    MP = new Set(pool.slice(0, Math.min(400, Math.max(20, Math.round(pool.length * 0.06)))).map(e=>e.id));
    const cut = pool.length ? pool[Math.min(pool.length - 1, Math.round(pool.length * 0.2))].br : 1e9;
    GEMS = IDX.filter(e=>e.vc >= 5 && e.br >= cut && e.r >= 6000 && !MP.has(e.id)).sort((a, b)=>b.br - a.br).slice(0, 300);   // una scoperta, non un mucchio
  }
  TBYT = null;
}
const masterpieces = () => IDX.filter(e=>MP.has(e.id)).sort((a, b)=>b.br - a.br || a.r - b.r);
function novita(){ return IDX.filter(e=>e.y >= YEAR - 1 && (!e.d || e.d <= TODAY)).sort((a, b)=>(b.d || String(b.y)).localeCompare(a.d || String(a.y)) || a.r - b.r); }

/* ---------- la tua discoteca: si legge, non si tocca ---------- */
function readCollection(){
  return new Promise(res=>{
    try{
      const r = indexedDB.open('mpml_music');
      r.onupgradeneeded = e => { try{ e.target.transaction.abort(); }catch(x){} };   // non esiste: non la creo (romperebbe l'app dei dischi)
      r.onsuccess = () => { const db = r.result;
        if(!db.objectStoreNames.contains('kv')){ db.close(); return res(null); }
        try{ const q = db.transaction('kv', 'readonly').objectStore('kv').get('collection'); q.onsuccess = () => { res(q.result || null); db.close(); }; q.onerror = () => { res(null); db.close(); }; }
        catch(e){ db.close(); res(null); } };
      r.onerror = () => res(null);
    }catch(e){ res(null); }
  }).then(v=>{ if(v) return v; try{ return JSON.parse(localStorage.getItem('mpmlm_collection') || 'null'); }catch(e){ return null; } });
}
async function loadOwn(){
  const col = await readCollection(); OWN = new Map(); if(!Array.isArray(col)) return;
  const byTA = new Map(); for(const e of IDX){ const k = norm(e.t) + '|' + norm(e.a); if(!byTA.has(k)) byTA.set(k, e); }
  for(const a of col){
    if(!a) continue;
    const rid = String(a.rgid || '').replace(/-/g, '').toLowerCase();
    const e = (rid && BY_ID.get(rid)) || byTA.get(norm(a.titolo) + '|' + norm(a.artista));
    if(e && !OWN.has(e.id)) OWN.set(e.id, a.formato || '');
  }
}

/* ---------- le tue liste, i tuoi voti, le tue classifiche ---------- */
const LS = (k, d) => { try{ const v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? d : v; }catch(e){ return d; } };
let LISTE = LS('amus-liste', {}), CLS = LS('amus-classifiche', []);
const saveL = () => { try{ localStorage.setItem('amus-liste', JSON.stringify(LISTE)); }catch(e){ toast('Memoria piena: scarica le liste'); } };
const saveC = () => { try{ localStorage.setItem('amus-classifiche', JSON.stringify(CLS)); }catch(e){ toast('Memoria piena: scarica le liste'); } };
function setL(id, patch){ const c = Object.assign({}, LISTE[id] || {}, patch); Object.keys(c).forEach(k=>{ if(!c[k]) delete c[k]; }); if(Object.keys(c).length) LISTE[id] = c; else delete LISTE[id]; saveL(); }

/* ---------- rete: memoria, MusicBrainz una richiesta al secondo ---------- */
let _db = null; const MEM = new Map();
function adb(){ if(_db) return _db; _db = new Promise(res=>{ try{ const r = indexedDB.open('atlante-musica', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => res(null); }catch(e){ res(null); } }); return _db; }
async function dget(k){ if(MEM.has(k)) return MEM.get(k); const db = await adb(); if(!db) return null; return new Promise(res=>{ try{ const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }catch(e){ res(null); } }); }
async function dset(k, v){ MEM.set(k, v); const db = await adb(); if(!db) return; try{ db.transaction('kv', 'readwrite').objectStore('kv').put(v, k); }catch(e){} }
async function jget(url, ms){ const c = new AbortController(), t = setTimeout(()=>c.abort(), ms || 15000); try{ const r = await fetch(url, { signal: c.signal }); if(!r.ok) throw new Error('http ' + r.status); return await r.json(); } finally{ clearTimeout(t); } }
let _mbq = Promise.resolve(), _mbl = 0;
function mbget(path){ const p = _mbq.then(async ()=>{ const w = 1100 - (Date.now() - _mbl); if(w > 0) await new Promise(r=>setTimeout(r, w)); _mbl = Date.now(); return jget('https://musicbrainz.org/ws/2/' + path); }); _mbq = p.catch(()=>{}); return p; }
const WD = 'https://www.wikidata.org/w/api.php?format=json&origin=*&';
const claimIds = (ent, p) => (((ent.claims || {})[p]) || []).map(c=>c.mainsnak && c.mainsnak.datavalue && c.mainsnak.datavalue.value && c.mainsnak.datavalue.value.id).filter(Boolean);
const claimVal = (ent, p) => { const c = (((ent.claims || {})[p]) || [])[0]; return c && c.mainsnak && c.mainsnak.datavalue ? c.mainsnak.datavalue.value : null; };
const wdLabel = ent => ent && ent.labels ? ((ent.labels.it || ent.labels.en || {}).value || '') : '';
async function wdEntities(ids, props){ const out = {}; for(let i = 0; i < ids.length; i += 50){ try{ const j = await jget(`${WD}action=wbgetentities&ids=${ids.slice(i, i + 50).join('|')}&props=${props || 'labels'}&languages=it|en`); Object.assign(out, j.entities || {}); }catch(e){} } return out; }
async function wdByMB(prop, mbid){ const j = await jget(`${WD}action=query&list=search&srsearch=haswbstatement:${prop}=${mbid}&srlimit=1`); return ((j.query && j.query.search) || [])[0] ? j.query.search[0].title : ''; }
async function wikiSummary(sl){
  for(const [k, lang] of [['itwiki', 'it'], ['enwiki', 'en']]){
    const t = sl && sl[k] && sl[k].title; if(!t) continue;
    try{ const w = await jget(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(t.replace(/ /g, '_'))}`);
      if(w && w.extract) return { text: w.extract, lang, url: (w.content_urls && w.content_urls.desktop && w.content_urls.desktop.page) || `https://${lang}.wikipedia.org/wiki/${encodeURIComponent(t)}`, img: (w.thumbnail && w.thumbnail.source) || '' }; }catch(e){}
  }
  return null;
}

function decades(){ const c = new Map(); for(const e of IDX){ if(e.y < 1940 || e.y > YEAR) continue; const d = Math.floor(e.y / 10) * 10; c.set(d, (c.get(d) || 0) + 1); } return [...c.entries()].filter(x=>x[1] >= 30).sort((a, b)=>a[0] - b[0]).map(([d, n])=>({ d, n })); }
function viewHome(){
  setNav(''); const dec = decades(), mx = Math.max(1, ...dec.map(x=>x.n));
  const scop = ['capolavori', 'gemme', 'live', 'colonne', 'raccolte', 'ep'].map(k=>[k, LISTS[k][1]().length]).filter(x=>x[1] > 0);
  V().innerHTML = `<div class="ruler">${dec.map(x=>`<a href="#decennio/${x.d}"><b>${decLabel(x.d)}</b><i style="height:${Math.round(6 + 34 * x.n / mx)}px"></i><small>${fmtN(x.n)}</small></a>`).join('')}</div>`

    + strip('🆕 Novità', novita(), '#lista/novita', 'Vedi tutte')

    + CLS.filter(c=>c.pin && c.items.length).map(c=>strip('🏆 ' + esc(c.name), c.items.map(id=>BY_ID.get(id)).filter(Boolean), '#classifica/' + c.id, 'Apri')).join('')
    + (scop.length ? `<h2 class="sec">Scopri</h2><div class="genres">${scop.map(([k, n])=>`<a class="genre" href="#lista/${k}"><b>${esc(LISTS[k][0])}</b><i>${fmtN(n)}</i></a>`).join('')}</div>` : '')
    + `<h2 class="sec">Per genere</h2><div class="genres">${GENRES.slice(0, 24).map(x=>`<a class="genre" href="#genere/${enc(x.g)}"><b>${esc(cap(x.g))}</b><i>${fmtN(x.n)}</i></a>`).join('')}</div>`
    + `<p class="note" style="margin-top:26px">${fmtN(IDX.length)} dischi da MusicBrainz${META.built ? ', indice del ' + esc(fmtD(META.built)) : ''}. <a class="lnk" href="../">Apri la tua Discoteca</a></p>`;
}
function viewList(k, arg){
  let title, base, lead;
  if(k === 'genere'){ title = cap(arg); base = IDX.filter(e=>e.g.includes(arg)); lead = 'Dal più famoso.'; }
  else if(k === 'decennio'){ const d = parseInt(arg, 10) || 1970; title = `Gli anni ${decLabel(d)}`; base = IDX.filter(e=>e.y >= d && e.y < d + 10); lead = 'Dal più famoso.'; }
  else { const L = LISTS[k]; if(!L) return viewHome(); title = L[0]; base = L[1](); lead = L[2]; }
  setNav(k === 'capolavori' ? 'capolavori' : '');
  if(k === 'capolavori' && !RATED) lead = 'I capolavori arrivano con il prossimo aggiornamento dell\'indice dei dischi, che porterà anche i voti degli utenti di MusicBrainz. Intanto trovi i dischi più famosi in Esplora.';
  const st = { g: '', d: '', t: '', n: 60 }, dec = decades();
  const opt = (id, first, items) => `<select id="${id}"><option value="">${first}</option>${items.map(([v, l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join('')}</select>`;
  V().innerHTML = `<h1 class="pg">${esc(title)}</h1><p class="lead">${esc(lead)}</p>`
    + (base.length ? `<div class="filters">${k !== 'genere' ? opt('fG', 'Tutti i generi', GENRES.slice(0, 60).map(x=>[x.g, cap(x.g)])) : ''}${k !== 'decennio' ? opt('fD', 'Tutti i decenni', dec.map(x=>[x.d, 'Anni ' + decLabel(x.d)])) : ''}${opt('fT', 'Tutti i tipi', [['studio', 'Album in studio'], ['ep', 'EP'], ['L', 'Dal vivo'], ['C', 'Raccolte'], ['S', 'Colonne sonore']])}</div><p class="note" id="cnt"></p><div class="grid" id="lst"></div><p style="margin-top:18px"><button class="btn" id="moreBtn">Mostra altri</button></p>` : '');
  if(!base.length) return;
  const apply = () => { let l = base; if(st.g) l = l.filter(e=>e.g.includes(st.g)); if(st.d){ const d = +st.d; l = l.filter(e=>e.y >= d && e.y < d + 10); } if(st.t) l = l.filter(e=>typeKey(e) === st.t);
    $('cnt').textContent = `${fmtN(l.length)} ${l.length === 1 ? 'disco' : 'dischi'}`; $('lst').innerHTML = l.slice(0, st.n).map(card).join(''); $('moreBtn').classList.toggle('hidden', l.length <= st.n); };
  ['fG', 'fD', 'fT'].forEach((id, i)=>{ if($(id)) $(id).onchange = ev => { st[['g', 'd', 't'][i]] = ev.target.value; st.n = 60; apply(); }; });
  $('moreBtn').onclick = () => { st.n += 60; apply(); };
  apply();
}

/* ---------- ricerca ---------- */
function search(q){
  const n = norm(q); if(n.length < 2) return { arts: [], albs: [] };
  const words = n.split(' ');
  const arts = [...ARTISTS.values()].filter(A=>A.k.includes(n) || words.every(w=>A.k.split(' ').some(x=>x.startsWith(w)))).sort((a, b)=>b.fame - a.fame).slice(0, 8);
  const albs = []; for(const e of IDX){ const s = e._k || (e._k = norm(e.t) + ' ' + norm(e.a)); if(words.every(w=>s.includes(w))){ albs.push(e); if(albs.length >= 80) break; } }
  return { arts, albs };
}
const personCard = A => `<a class="person" href="#artista/${enc(A.name)}"><span class="ini">${esc(initials(A.name))}</span><span style="min-width:0"><b>${esc(A.name)}</b><small>${A.list.length} ${A.list.length === 1 ? 'disco' : 'dischi'}</small></span></a>`;
function viewSearch(q){
  setNav(''); if($('q') !== document.activeElement) $('q').value = q;
  const { arts, albs } = search(q);
  V().innerHTML = `<h1 class="pg">“${esc(q)}”</h1>` + (arts.length ? `<h2 class="sec">Artisti</h2><div class="people">${arts.map(personCard).join('')}</div>` : '')
    + (albs.length ? `<h2 class="sec">Dischi</h2><div class="rows">${albs.map(row).join('')}</div>` : '')
    + (!arts.length && !albs.length ? '<p class="lead">Nessun risultato. L\'atlante contiene gli 80.000 dischi più conosciuti: prova con un altro titolo o con il nome dell\'artista.</p>' : '');
}

async function albumOnline(e){
  const key = 'alb1:' + e.id, c = await dget(key); if(c && Date.now() - c.at < 30 * 864e5) return c;
  if(navigator.onLine === false) return c || { offline: 1 };
  const out = { at: Date.now() };
  try{
    const j = await mbget(`release?release-group=${uuid(e.id)}&inc=recordings+media&status=official&limit=25&fmt=json`);
    const rels = (j.releases || []).filter(r=>(r.media || []).some(m=>(m.tracks || []).length)).sort((a, b)=>(a.date || '9999').localeCompare(b.date || '9999'));
    const best = rels.find(r=>/^(XW|XE|US|GB|IT)$/.test(r.country || '')) || rels[0];
    if(best){ out.tracks = []; best.media.forEach((m, mi)=>(m.tracks || []).forEach(t=>out.tracks.push({ d: best.media.length > 1 ? mi + 1 : 0, n: t.number || t.position, t: t.title, ms: t.length || (t.recording && t.recording.length) || 0 })));
      out.ed = [best.date || '', best.country || ''].filter(Boolean).join(', '); }
  }catch(err){}
  try{
    const qid = await wdByMB('P436', uuid(e.id));
    if(qid){
      out.qid = qid;
      const ent = (await wdEntities([qid], 'claims|sitelinks'))[qid] || {};
      const P = { label: claimIds(ent, 'P264'), prod: claimIds(ent, 'P162'), aw: claimIds(ent, 'P166'), prev: claimIds(ent, 'P155').slice(0, 1), next: claimIds(ent, 'P156').slice(0, 1) };
      const refs = [...new Set(Object.values(P).flat())], labs = refs.length ? await wdEntities(refs, 'labels|claims') : {};
      const ref = q => { const x = labs[q]; const mb = x && claimVal(x, 'P436'); const inIdx = mb && BY_ID.get(String(mb).replace(/-/g, '')); return { l: wdLabel(x), id: inIdx ? inIdx.id : '' }; };
      out.f = {}; Object.entries(P).forEach(([k, l])=>{ out.f[k] = l.map(ref).filter(x=>x.l); });
      out.wiki = await wikiSummary(ent.sitelinks);
    }
  }catch(err){}
  await dset(key, out); return out;
}
function renderAlbumOnline(e, d){
  if(!d || d.offline){ $('online').innerHTML = '<p class="note">Tracce e notizie arriveranno con la rete.</p>'; return; }
  const parts = [];
  if(d.tracks && d.tracks.length){
    const tot = d.tracks.reduce((s, t)=>s + (t.ms || 0), 0); let disc = 0;
    parts.push(box('Le tracce', `<ol class="tracks">${d.tracks.map(t=>{ let h = ''; if(t.d && t.d !== disc){ disc = t.d; h = `<li class="disc">Disco ${t.d}</li>`; } return h + `<li><span class="tn">${esc(t.n)}</span><span>${esc(t.t)}</span><span class="tl">${t.ms ? dur(t.ms) : ''}</span></li>`; }).join('')}</ol><p class="note">${d.tracks.length} tracce${tot ? ', ' + durTot(tot) : ''}${d.ed ? '. Edizione: ' + esc(d.ed) : ''}.</p>`));
  }
  if(d.wiki) parts.push(box('La storia', `<p class="plot"${d.wiki.lang === 'en' ? ' lang="en"' : ''}>${esc(d.wiki.text)}</p><p class="note"><a class="lnk" href="${esc(d.wiki.url)}" target="_blank" rel="noopener">Continua su Wikipedia${d.wiki.lang === 'en' ? ' (in inglese)' : ''} ↗</a></p>`));
  const f = d.f || {}, kv = [], names = l => l.map(x=>x.id ? `<a class="lnk" href="#album/${x.id}">${esc(x.l)}</a>` : esc(x.l)).join(', ');
  if(f.label && f.label.length) kv.push(['Etichetta', names(f.label)]);
  if(f.prod && f.prod.length) kv.push(['Produzione', names(f.prod)]);
  if(f.aw && f.aw.length) kv.push(['Premi', names(f.aw.slice(0, 6))]);
  if(f.prev && f.prev.length) kv.push(['Disco precedente', names(f.prev)]);
  if(f.next && f.next.length) kv.push(['Disco successivo', names(f.next)]);
  if(kv.length) parts.push(box('Scheda', `<dl class="kv">${kv.map(([k, v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`));
  parts.push(`<p class="note">Fonti: <a class="lnk" href="https://musicbrainz.org/release-group/${uuid(e.id)}" target="_blank" rel="noopener">MusicBrainz ↗</a>${d.qid ? ` · <a class="lnk" href="https://www.wikidata.org/wiki/${esc(d.qid)}" target="_blank" rel="noopener">Wikidata ↗</a>` : ''}</p>`);
  $('online').innerHTML = parts.join('');
}

async function artistOnline(A){
  const key = 'art1:' + A.k, c = await dget(key); if(c && Date.now() - c.at < 60 * 864e5) return c;
  if(navigator.onLine === false) return c;
  const out = { at: Date.now() };
  // l'artista si trova attraverso i suoi dischi più famosi: niente omonimi
  for(const e of A.list.slice(0, 3)){
    try{
      const aq = await wdByMB('P436', uuid(e.id)); if(!aq) continue;
      const alb = (await wdEntities([aq], 'claims'))[aq] || {}, perf = claimIds(alb, 'P175'); if(!perf.length) continue;
      const ents = await wdEntities(perf, 'labels|claims|sitelinks');
      const hit = perf.find(q=>{ const l = norm(wdLabel(ents[q])); return l && (l === A.k || A.k.includes(l) || l.includes(A.k)); });
      if(!hit) continue;
      const x = ents[hit]; out.qid = hit;
      const img = claimVal(x, 'P18'); if(img) out.img = 'https://commons.wikimedia.org/wiki/Special:FilePath/' + enc(img) + '?width=240';
      const yr = p => { const v = claimVal(x, p); const m = v && v.time && v.time.match(/^[+-](\d{4})/); return m ? m[1] : ''; };
      const from = yr('P571') || yr('P569'), to = yr('P576') || yr('P570'), band = !!claimVal(x, 'P571');
      const cq = (claimIds(x, 'P495')[0] || claimIds(x, 'P27')[0] || claimIds(x, 'P740')[0]); const cl = cq ? wdLabel((await wdEntities([cq]))[cq]) : '';
      out.facts = [band ? (from ? `In attività dal ${from}${to ? ' al ' + to : ''}` : '') : (from ? `Nato nel ${from}${to ? ', morto nel ' + to : ''}` : ''), cl].filter(Boolean).join(' · ');
      out.wiki = await wikiSummary(x.sitelinks);
      break;
    }catch(err){}
  }
  await dset(key, out); return out;
}

function csvRows(text){ const first = text.split(/\r?\n/)[0] || '', sep = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',', rows = []; let r = [], c = '', q = false;
  for(let i = 0; i < text.length; i++){ const ch = text[i]; if(q){ if(ch === '"'){ if(text[i + 1] === '"'){ c += '"'; i++; } else q = false; } else c += ch; } else if(ch === '"') q = true; else if(ch === sep){ r.push(c); c = ''; } else if(ch === '\n' || ch === '\r'){ if(ch === '\r' && text[i + 1] === '\n') i++; r.push(c); rows.push(r); r = []; c = ''; } else c += ch; }
  if(c || r.length){ r.push(c); rows.push(r); } return rows.filter(x=>x.some(y=>y.trim())); }
function csvToLines(t){
  t = String(t || '').replace(/^\uFEFF/, ''); const first = t.split(/\r?\n/)[0] || ''; if(!/[,;]/.test(first)) return t;
  const rows = csvRows(t); if(rows.length < 2) return t; const h = rows[0].map(x=>norm(x)), f = re => h.findIndex(x=>re.test(x));
  const ti = f(/^(album|title|titolo|disco|record)$/), ai = f(/^(artist|artista|artists|band|performer)$/), ri = f(/^(rank|pos|posizione|n|numero)$/), yi = f(/^(year|anno|years)$/);
  if(ti < 0) return t;
  return rows.slice(1).map(r=>{ const tt = (r[ti] || '').trim(); if(!tt) return ''; const rk = ri >= 0 ? (r[ri] || '').trim() : '', aa = ai >= 0 ? (r[ai] || '').trim() : '', yy = yi >= 0 ? (r[yi] || '').trim() : '';
    return `${/^\d+$/.test(rk) ? rk + '. ' : ''}${tt}${aa ? ' - ' + aa : ''}${yy ? ' (' + yy + ')' : ''}`; }).filter(Boolean).join('\n');
}
function matchLine(line){
  if(!TBYT){ TBYT = new Map(); for(const e of IDX){ const k = norm(e.t); if(!TBYT.has(k)) TBYT.set(k, []); TBYT.get(k).push(e); } }
  let s = String(line).replace(/^\s*(?:#|n\.?\s*)?\d{1,4}\s*[.)\-:–]?\s+/i, '').replace(/["“”«»]/g, '').trim();
  const ym = s.match(/\((\d{4})\)/), y = ym ? +ym[1] : 0; s = s.replace(/\(\d{4}\)/g, '').trim();
  const parts = s.split(/\s+[–—-]\s+|\s+by\s+|\s*;\s*|\t/).map(x=>x.trim()).filter(Boolean), cand = [];
  const tryTA = (t, a) => { const kt = norm(t), ka = a ? norm(a) : ''; for(const e of (TBYT.get(kt) || [])){ const ea = norm(e.a); if(!ka || ea === ka || ea.includes(ka) || ka.includes(ea)) cand.push({ e, sc: (ka ? (ea === ka ? 3 : 2) : 1) + (y && Math.abs(e.y - y) <= 1 ? 2 : 0) - e.r / 1e6 }); } };
  if(parts.length >= 2){ tryTA(parts[0], parts.slice(1).join(' - ')); tryTA(parts.slice(1).join(' - '), parts[0]); }
  if(!cand.length && /,/.test(s)){ const i = s.lastIndexOf(','); tryTA(s.slice(0, i), s.slice(i + 1)); tryTA(s.slice(i + 1), s.slice(0, i)); }
  if(!cand.length) tryTA(s, '');
  cand.sort((a, b)=>b.sc - a.sc); return cand[0] ? cand[0].e : null;
}
function importList(name, text){
  const lines = csvToLines(text).split(/\r?\n/).map(x=>x.trim()).filter(x=>x && !/^(rank|pos)\b/i.test(x)), items = [], miss = [];
  for(const l of lines){ const e = matchLine(l); if(e){ if(!items.includes(e.id)) items.push(e.id); } else miss.push(l.slice(0, 120)); }
  const c = { id: rid(), name: name || 'Classifica importata', size: 0, items, miss, pin: true }; CLS.push(c); saveC(); return c;
}

function route(){

  window.scrollTo(0, 0);
  if(k === 'album') return viewAlbum(arg);
  if(k === 'artista') return viewArtist(arg);
  if(k === 'artisti') return viewArtists();
  if(k === 'lista') return viewList(arg);
  if(k === 'genere') return viewList('genere', arg);
  if(k === 'decennio') return viewList('decennio', arg);
  if(k === 'cerca') return viewSearch(arg);
  if(k === 'liste') return viewMine(arg);
  if(k === 'classifiche') return viewRankings();
  if(k === 'classifica') return viewRanking(arg);
  if(k === 'strumenti') return viewTools();
  return viewHome();
}
