<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlante della Musica</title>
<meta name="theme-color" content="#101417">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:'Inter Atlante'; src:url('fonts/inter-var.woff2') format('woff2'); font-weight:100 900; font-display:swap;}   /* Inter, SIL Open Font License: fonts/OFL.txt */
:root{
  --ink:#101417; --s1:#161C20; --s2:#1D252A; --s3:#26313A; --line:#2B3740;
  --paper:#ECE7DC; --paper2:#B8B3A8; --paper3:#857F74;
  --acc:#4FD1A5; --acc2:#2E9C7A; --amber:#E9A23B; --amber2:#F5C26B;
  --ui:-apple-system, BlinkMacSystemFont, 'Inter Atlante', 'Segoe UI', Roboto, Arial, sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0; background:var(--ink); color:var(--paper); font-family:var(--ui); -webkit-font-smoothing:antialiased; letter-spacing:-0.003em;}
body{padding-bottom:env(safe-area-inset-bottom,0px);}
a{color:inherit; text-decoration:none;}
button{font:inherit; color:inherit;}
.top{position:sticky; top:0; z-index:5; background:rgba(16,20,23,.9); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line); padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,4vw) 6px;}
.brand{display:inline-flex; align-items:center; gap:10px;} .brand img{width:30px; height:30px; border-radius:8px;}
.brand b{font-size:21px; font-weight:800; letter-spacing:-.025em;}
#q{width:100%; height:42px; margin:10px 0 6px; border-radius:21px; border:1px solid var(--line); background:var(--s1); color:var(--paper); padding:0 16px; font:inherit; font-size:16px; outline:none;}
#q:focus{border-color:var(--acc2);}
.nav{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; margin:0 -6px;} .nav::-webkit-scrollbar{display:none;}
.nav a{padding:8px 13px; border-radius:18px; font-weight:600; color:var(--paper2); white-space:nowrap; font-size:15px;}
.nav a.on{background:var(--s3); color:var(--paper);}
main{position:relative; padding:14px max(16px,4vw) 70px; max-width:1280px; margin:0 auto;}
h1.pg{font-size:31px; font-weight:800; letter-spacing:-.03em; margin:6px 0 6px; line-height:1.08;}
h2.sec{display:flex; align-items:baseline; justify-content:space-between; gap:12px; font-size:21px; font-weight:700; letter-spacing:-.02em; margin:28px 0 12px;}
h2.sec .cnt{color:var(--paper3); font-weight:600; font-size:15px; margin-right:auto; margin-left:8px;}
.more{font-size:14px; font-weight:600; color:var(--acc); white-space:nowrap;}
.lead{color:var(--paper2); margin:0 0 14px; line-height:1.55; max-width:760px;}
.note{color:var(--paper3); font-size:13.5px; line-height:1.55;}
.lbl{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--paper3); margin:18px 0 8px;}
.lnk{color:var(--acc);}
/* copertine */
.strip{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(132px,152px); gap:14px; overflow-x:auto; padding-bottom:8px; scroll-snap-type:x proximity; scrollbar-width:thin;}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:16px 14px;}
.card{display:block; min-width:0; scroll-snap-align:start;}
.cv{position:relative; aspect-ratio:1; border-radius:10px; overflow:hidden; background:var(--tilebg,#26313A); box-shadow:0 6px 18px rgba(0,0,0,.35);}
.cv img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
.cv .ph{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-end; padding:10px; background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(0,0,0,.25));}
.cv .ph span{font-weight:800; font-size:15px; line-height:1.15; letter-spacing:-.015em; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;}
.cv .ph small{color:rgba(236,231,220,.75); font-size:12px; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.cv img ~ .ph{display:none;}
.cv .mk,.cv .own{position:absolute; top:6px; font-style:normal; font-size:12px; font-weight:800; padding:2px 7px; border-radius:9px; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);}
.cv .mk{left:6px; background:rgba(16,20,23,.72); color:var(--amber2);} .cv .own{right:6px; background:rgba(16,20,23,.72); color:var(--acc);}
.card b{display:block; font-size:14px; font-weight:650; margin-top:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-.01em;}
.card small{display:block; color:var(--paper3); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px;}
/* righe */
.rows{display:flex; flex-direction:column;}
.fr{display:grid; grid-template-columns:56px minmax(0,1fr) auto; gap:12px; align-items:center; padding:9px 2px; border-bottom:1px solid var(--line);}
.fr .cv{width:56px; border-radius:6px; box-shadow:none;} .fr .cv .ph,.fr .cv .mk,.fr .cv .own{display:none;}
.fr b{font-weight:650; font-size:15.5px; letter-spacing:-.01em;} .fr .sub{display:block; color:var(--paper3); font-size:13px; margin-top:2px;}
.badges{display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end;}
.bd{font-size:12px; padding:3px 9px; border-radius:10px; background:var(--s3); color:var(--paper2); font-weight:650; white-space:nowrap;}
.bd.mp{background:rgba(233,162,59,.18); color:var(--amber2);} .bd.own{background:rgba(79,209,165,.16); color:var(--acc);} .bd.me{background:rgba(233,162,59,.9); color:#1d1406;}
@media (max-width:560px){ .fr{grid-template-columns:56px minmax(0,1fr);} .fr .badges{grid-column:2; justify-content:flex-start;} }
/* esplora */
.ruler{display:flex; gap:8px; overflow-x:auto; padding:4px 0 6px; scrollbar-width:none;} .ruler::-webkit-scrollbar{display:none;}
.ruler a{flex:none; display:flex; flex-direction:column; align-items:center; gap:5px; min-width:64px; padding:10px 10px 8px; border-radius:14px; background:var(--s1); border:1px solid var(--line);}
.ruler a b{font-size:15px; font-weight:750;} .ruler a i{display:block; width:26px; border-radius:4px; background:linear-gradient(var(--acc),var(--acc2)); min-height:4px;}
.ruler a small{color:var(--paper3); font-size:11.5px;}
.genres{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px;}
.genre{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; padding:14px; border-radius:14px; background:var(--s2); min-height:64px;}
.genre b{font-weight:700; font-size:15.5px; line-height:1.25; letter-spacing:-.01em;} .genre i{font-style:normal; color:var(--paper3); font-size:13px; font-weight:600;}
.chips{display:flex; flex-wrap:wrap; gap:8px;} .chip{padding:7px 12px; border-radius:16px; background:var(--s2); font-size:14px; font-weight:600;}
/* album */
.hero{position:absolute; left:0; right:0; top:0; height:460px; background:center/cover no-repeat; filter:blur(48px) saturate(1.3); opacity:.32; z-index:-1;
  -webkit-mask-image:linear-gradient(#000,transparent); mask-image:linear-gradient(#000,transparent); pointer-events:none;}
.album-head{display:grid; grid-template-columns:minmax(0,300px) minmax(0,1fr); gap:28px; align-items:start; margin-top:8px;}
.album-head > .cv{box-shadow:0 18px 50px rgba(0,0,0,.55);}
.by{font-size:19px; font-weight:650; margin:2px 0 4px;} .meta{color:var(--paper2); margin:0 0 12px;}
@media (max-width:680px){ .album-head{grid-template-columns:1fr; gap:18px;} .album-head > .cv{max-width:320px; width:78%; margin:0 auto;} }
.listen{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; max-width:560px;}
.listen a{display:flex; align-items:center; justify-content:center; gap:8px; height:46px; border-radius:23px; background:var(--s2); border:1px solid var(--line); font-weight:700; font-size:14.5px; text-align:center; padding:0 8px;}
.listen a::before{content:""; width:10px; height:10px; border-radius:50%; background:var(--brand); flex:none;}
.listen a:hover{border-color:var(--brand);}
.acts{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px;}
.btn{display:inline-flex; align-items:center; gap:6px; height:40px; padding:0 16px; border-radius:20px; border:1px solid var(--line); background:var(--s2); color:var(--paper); font-weight:650; font-size:14.5px; cursor:pointer;}
.btn.on{background:var(--acc); color:#06261C; border-color:transparent;} .btn.sm{height:34px; padding:0 12px; font-size:13.5px;}
.rate{display:flex; flex-wrap:wrap; gap:6px;} .rate button{width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:var(--s2); font-weight:700; cursor:pointer;}
.rate button.on{background:var(--amber); color:#1d1406; border-color:transparent;}
.box{background:var(--s1); border:1px solid var(--line); border-radius:14px; margin:18px 0; overflow:hidden;}
.box h3{margin:0; padding:12px 16px; border-bottom:1px solid var(--line); font-size:16px; font-weight:700; letter-spacing:-.01em;} .box .in{padding:12px 16px;}
.plot{line-height:1.65; margin:0 0 8px; font-size:16px;}
.tracks{list-style:none; margin:0; padding:0;} .tracks li{display:grid; grid-template-columns:32px minmax(0,1fr) auto; gap:10px; padding:8px 0; border-bottom:1px solid rgba(255,255,255,.05);}
.tracks .tn{color:var(--paper3); font-variant-numeric:tabular-nums; text-align:right;} .tracks .tl{color:var(--paper3); font-variant-numeric:tabular-nums;}
.tracks .disc{display:block; padding:12px 0 4px; color:var(--paper3); font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.06em; border:0;}
.kv{display:grid; grid-template-columns:max-content minmax(0,1fr); gap:8px 16px; margin:0;} .kv dt{color:var(--paper3);} .kv dd{margin:0;}
/* artista */
.art-head{display:flex; gap:20px; align-items:center; margin-top:8px;}
.ph-art{flex:none; width:112px; height:112px; border-radius:50%; background:var(--s3); display:flex; align-items:center; justify-content:center; font-size:36px; font-weight:800; color:var(--paper3); overflow:hidden; position:relative;}
.ph-art img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
.people{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px;}
.person{display:flex; align-items:center; gap:12px; padding:10px; border-radius:14px; background:var(--s1); border:1px solid var(--line); min-width:0;}
.person .ini{flex:none; width:44px; height:44px; border-radius:50%; background:var(--s3); display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--paper3);}
.person b{display:block; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;} .person small{color:var(--paper3);}
/* moduli */
.filters{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 12px;}
select,input[type=text],input[type=search],textarea{background:var(--s1); color:var(--paper); border:1px solid var(--line); border-radius:10px; font:inherit; font-size:15px; padding:8px 10px;}
select{height:38px;} textarea{width:100%; min-height:140px;}
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 14px;} .tabs a{padding:8px 14px; border-radius:18px; background:var(--s1); border:1px solid var(--line); font-weight:650; font-size:14.5px;} .tabs a.on{background:var(--s3);}
.rk{display:grid; grid-template-columns:30px 48px minmax(0,1fr) auto; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line);}
.rk .n{color:var(--amber2); font-weight:800; text-align:right;} .rk .cv{width:48px; border-radius:5px; box-shadow:none;} .rk .cv .ph{display:none;}
.rk .ctl{display:flex; gap:4px;} .rk .ctl button{width:32px; height:32px; border-radius:8px; border:1px solid var(--line); background:var(--s2); cursor:pointer;}
.hidden{display:none !important;}
#toast{position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--paper); color:#111; padding:10px 16px; border-radius:20px; font-weight:650; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:20; max-width:90vw; text-align:center;}
#toast.on{opacity:1;}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;} }

.btn.amber{background:var(--amber); color:#1d1406; border-color:transparent;}
.st-chips{display:flex; flex-wrap:wrap; gap:8px;} .st-chip{height:40px; padding:0 14px; border-radius:20px; border:1px solid var(--line); background:var(--s2); color:var(--paper); font:inherit; font-weight:650; font-size:15px; cursor:pointer;}
.st-chip.on{background:var(--amber); color:#1d1406; border-color:transparent;}
.st-row{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
.st-res{display:grid; grid-template-columns:repeat(auto-fill, minmax(290px, 1fr)); gap:16px; margin-top:16px;}
.st-card{display:grid; grid-template-columns:118px minmax(0,1fr); gap:14px; background:var(--s1); border:1px solid var(--line); border-radius:14px; padding:12px; align-items:start;}
.st-card .cv{width:118px;} .st-info{display:flex; flex-direction:column; gap:6px; min-width:0;} .st-info b{font-size:18px; font-weight:750; letter-spacing:-.015em;} .st-tier{color:var(--amber2); font-weight:700; font-size:14px;}
.trx .plot{white-space:pre-line;}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#"><img src="icons/icon-192.png" alt=""><b>Atlante della Musica</b></a>
  <input id="q" type="search" placeholder="Cerca un album o un artista…" autocomplete="off" enterkeyhint="search">
  <nav class="nav" id="nav">
    <a href="#" data-k="">Esplora</a><a href="#lista/capolavori" data-k="capolavori">Capolavori</a><a href="#artisti" data-k="artisti">Artisti</a>
    <a href="#liste" data-k="liste">Le mie liste</a><a href="#classifiche" data-k="classifiche">Classifiche</a><a href="#strumenti" data-k="strumenti">Strumenti</a>
  </nav>
</header>
<main id="view"><p class="note">Apro l'atlante…</p></main>
<div id="toast"></div>
<script>
'use strict';
/* =====================================================================
   Atlante della Musica — legge l'indice dell'app dei dischi (../index.html)
   ===================================================================== */
const APP_VERSION = '1.5';
const $ = id => document.getElementById(id), V = () => $('view');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, ' ').trim();
const uuid = id => id.length === 32 ? `${id.slice(0, 8)}-${id.slice(8, 12)}-${id.slice(12, 16)}-${id.slice(16, 20)}-${id.slice(20)}` : id;
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
const NOW = new Date(), YEAR = NOW.getFullYear(), TODAY = NOW.toISOString().slice(0, 10);
const MESI = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
const fmtD = d => { const m = String(d || '').match(/^(\d{4})-(\d\d)-(\d\d)$/); return m ? `${+m[3]} ${MESI[+m[2] - 1]} ${m[1]}` : String(d || ''); };
const fmtN = n => Number(n || 0).toLocaleString('it-IT');
const dur = ms => { const s = Math.round((ms || 0) / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const durTot = ms => { const m = Math.round((ms || 0) / 60000); return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`; };
function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(()=>el.classList.remove('on'), 2600); }

/* ---------- l'indice ---------- */
let ABS = new Set(), GRAN = new Set(), HAS_SL = false, HAS_CL = false, CAPO_TOP = [], CAPO_FAM = {}, FAM_ART = {}, REF = {}, ACCLAIM = [], HAS_W = false, IDX = [], BY_ID = new Map(), ARTISTS = new Map(), GENRES = [], META = { built: '', dump: '' }, RATED = false, MP = new Set(), GEMS = [], OWN = new Map(), TBYT = null;
const TYPES = { L: 'Dal vivo', C: 'Raccolta', S: 'Colonna sonora', R: 'Remix' };
const typeLabel = e => e.ty[0] === 'E' ? 'EP' : (TYPES[e.ty[1]] || 'Album');
const typeKey = e => e.ty[0] === 'E' ? 'ep' : e.ty.length > 1 ? e.ty[1] : 'studio';

async function gunzipB64(b64){
  const bin = atob(b64), u = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}
async function loadIndex(){
  let html;
  try{ const r = await fetch('../index.html', { cache: 'no-cache' }); if(!r.ok) throw new Error('http'); html = await r.text(); }
  catch(e){ const r = await fetch('../index.html', { cache: 'force-cache' }); html = await r.text(); }   // offline: la copia salvata
  const m = html.match(/<script type="text\/plain" id="mbIndexData"([^>]*)>([^<]*)<\/script>/);
  if(!m || !m[2].trim()) throw new Error('noindex');
  META.built = (m[1].match(/data-built="([^"]*)"/) || [])[1] || ''; META.dump = (m[1].match(/data-dump="([^"]*)"/) || [])[1] || '';
  build(await gunzipB64(m[2].trim()));
}
function build(txt){
  IDX = []; HAS_W = false; HAS_CL = false;
  for(const l of txt.split('\n')){
    if(!l) continue; const p = l.split('|'); if(p.length < 5 || p[0].length !== 32) continue;
    IDX.push({ id: p[0], t: p[1] || '', a: p[2] || '', y: parseInt(p[3], 10) || 0, ty: p[4] || 'A', g: p[5] ? p[5].split(', ').filter(Boolean) : [],
      rv: parseInt(p[6], 10) || 0, vc: parseInt(p[7], 10) || 0, d: p[8] || '', w: p[9] === '1', sl: parseInt(p[10], 10) || 0, cl: 0, aw: parseInt(p[11], 10) || 0, r: IDX.length });   // w: voce su Wikidata; sl: in quante Wikipedia ha un articolo; aw: premi
    if(p.length >= 10) HAS_W = true;   // r: posizione per fama (l'indice è già in ordine)
  }
  BY_ID = new Map(IDX.map(e=>[e.id, e]));
  ARTISTS = new Map();
  for(const e of IDX){ const k = norm(e.a); if(!k) continue; let A = ARTISTS.get(k); if(!A){ A = { name: e.a, k, list: [], fame: 0 }; ARTISTS.set(k, A); } A.list.push(e); A.fame += 1 / Math.sqrt(e.r + 25); }
  const mc = new Map(), fam = g => { if(!mc.has(g)){ const l = g.toLowerCase(); const k = MACRO_ORDER.find(k=>MACRO.find(x=>x[0] === k)[2].some(x=>l.includes(x))); mc.set(g, k || ''); } return mc.get(g); };
  for(const e of IDX){ e.m = ''; for(const g of e.g){ const f = fam(g); if(f){ e.m = f; break; } } }   // la famiglia del primo genere riconosciuto
  FAM_ART = {}; REF = {};
  for(const A of ARTISTS.values()){ A.ff = {}; for(const e of A.list) if(e.m && !e.sus) A.ff[e.m] = (A.ff[e.m] || 0) + 1 / Math.sqrt(e.r + 25); A.hasW = A.list.some(e=>e.w); A.sus = A.list.every(e=>e.sus); }
  for(const [k] of MACRO){ FAM_ART[k] = [...ARTISTS.values()].filter(A=>A.ff[k] && !A.sus && !VARIOUS.test(A.name) && A.list.filter(e=>e.m === k).length >= 2 && (!HAS_W || A.hasW)).sort((a, b)=>b.ff[k] - a.ff[k]); REF[k] = FAM_ART[k].slice(0, 12); }
  const gc = new Map(); for(const e of IDX) for(const g of e.g) gc.set(g, (gc.get(g) || 0) + 1);
  GENRES = [...gc.entries()].filter(x=>x[1] >= 30).sort((a, b)=>b[1] - a[1]).map(([g, n])=>({ g, n }));
  /* Capolavori. Segnali: classifiche della critica e premi (Wikidata), voti degli utenti di MusicBrainz (pochi e a volte
     manipolati: decine di 5 stelle a dischi sconosciuti). Difese provate sui dati veri: solo album in studio, medie perfette
     scartate, voto pesato prudente, solo tra i dischi più conosciuti, pochi dischi per artista; con la colonna "wiki", solo
     dischi con una voce su Wikipedia. Oltre ai più grandi in assoluto, i migliori di ogni genere. */
  HAS_CL = false;   // le "classifiche della critica" su Wikidata si sono rivelate quasi vuote (47 dischi su 80.000): non si usano
  HAS_SL = IDX.filter(e=>e.sl).length >= 5000;   // in quante Wikipedia del mondo il disco ha un articolo: difficilissimo da falsificare
  // dischi sospetti: medie perfette con 5 o più voti (Kid Indigo, Mississippi Mass Choir…); con le lingue, anche dischi "famosissimi" senza un solo articolo
  for(const e of IDX) e.sus = (e.rv >= 98 && e.vc >= 5) || (HAS_SL && e.r < 3000 && !e.sl && e.vc >= 8 && e.rv >= 85);
  const trusted = e => e.ty === 'A' && !e.sus && !(e.rv >= 98) && (!HAS_W || e.w) && (!HAS_SL || e.sl >= 2);
  const base = IDX.filter(e=>e.vc >= 5 && e.rv && e.rv < 98), C = base.reduce((s, e)=>s + e.rv, 0) / Math.max(1, base.length);
  const score = (e, m) => (e.vc && e.rv ? (e.vc * e.rv + m * C) / (e.vc + m) : C) + (HAS_CL ? 4 * Math.min(e.cl, 5) : 0) + Math.min(e.aw, 4) + (HAS_SL ? 2.2 * Math.log2(1 + Math.min(e.sl, 80)) : 0);   // premi e notorietà nel mondo: contano, ma non quanto il voto
  for(const e of IDX) e.br = score(e, 30);
  const capped = (l, cap, n) => { const per = new Map(), out = []; for(const e of l){ const k = norm(e.a), c = per.get(k) || 0; if(c >= cap) continue; per.set(k, c + 1); out.push(e); if(out.length >= n) break; } return out; };
  CAPO_TOP = capped(IDX.filter(e=>trusted(e) && e.r < 20000 && ((e.vc >= 15 && e.rv) || (HAS_CL && e.cl >= 2))).sort((a, b)=>b.br - a.br || a.r - b.r), 3, 150);
  CAPO_FAM = {};
  for(const [k] of MACRO){ const l = IDX.filter(e=>e.m === k && trusted(e) && e.r < 25000 && ((e.vc >= 8 && e.rv) || (HAS_CL && e.cl >= 1))); l.forEach(e=>{ e.bf = score(e, 20); });
    CAPO_FAM[k] = capped(l.sort((a, b)=>b.bf - a.bf || a.r - b.r), 2, 16); }
  MP = new Set(CAPO_TOP.map(e=>e.id)); Object.values(CAPO_FAM).forEach(l=>l.forEach(e=>MP.add(e.id)));
  RATED = MP.size >= 20;
  // i livelli, come nell'Atlante del Cinema: ✦✦ i 50 più grandi, ✦ gli altri capolavori, ◆ i gran dischi (gli 800 migliori dopo i capolavori, al massimo 3 per artista)
  ABS = new Set(CAPO_TOP.slice(0, 50).map(e=>e.id));
  GRAN = new Set(capped(IDX.filter(e=>trusted(e) && !MP.has(e.id) && e.vc >= 8 && e.rv && e.r < 30000).sort((a, b)=>b.br - a.br || a.r - b.r), 3, 800).map(e=>e.id));
  for(const e of IDX) e.tier = ABS.has(e.id) ? 3 : MP.has(e.id) ? 2 : GRAN.has(e.id) ? 1 : 0;
  const bg = e => (e.vc * e.rv + 10 * C) / (e.vc + 10);   // gemme: meno votate, peso più leggero; tra il 3.000° e il 15.000° posto
  GEMS = capped(IDX.filter(e=>e.vc >= 8 && e.rv && e.r >= 3000 && e.r < 15000 && trusted(e) && !MP.has(e.id) && bg(e) >= 85).sort((a, b)=>bg(b) - bg(a) || a.r - b.r), 2, 150);
  GEMS.forEach(e=>{ e.gem = true; });
  ACCLAIM = HAS_CL ? IDX.filter(e=>e.cl >= 3 && (!HAS_W || e.w) && e.ty[0] === 'A').sort((a, b)=>b.cl - a.cl || a.r - b.r).slice(0, 300) : [];
  TBYT = null;
}

function readCollection(){

    try{
      const r = indexedDB.open('mpml_music');
      r.onupgradeneeded = e => { try{ e.target.transaction.abort(); }catch(x){} };   // non esiste: non la creo (romperebbe l'app dei dischi)
      r.onsuccess = () => { const db = r.result;
        if(!db.objectStoreNames.contains('kv')){ db.close(); return res(null); }
        try{ const q = db.transaction('kv', 'readonly').objectStore('kv').get('collection'); q.onsuccess = () => { res(q.result || null); db.close(); }; q.onerror = () => { res(null); db.close(); }; }
        catch(e){ db.close(); res(null); } };
      r.onerror = () => res(null);
    }catch(e){ res(null); }
  }).then(v=>{ if(v) return v; try{ return JSON.parse(localStorage.getItem('mpmlm_collection') || 'null'); }catch(e){ return null; } });

const INSTR_IT = { 'guitar':'chitarra', 'electric guitar':'chitarra elettrica', 'acoustic guitar':'chitarra acustica', 'bass guitar':'basso', 'bass':'basso', 'electric bass guitar':'basso elettrico',
  'drums (drum set)':'batteria', 'drums':'batteria', 'piano':'pianoforte', 'keyboard':'tastiere', 'organ':'organo', 'synthesizer':'sintetizzatore', 'lead vocals':'voce solista', 'background vocals':'cori',
  'vocal':'voce', 'violin':'violino', 'cello':'violoncello', 'viola':'viola', 'saxophone':'sassofono', 'tenor saxophone':'sax tenore', 'alto saxophone':'sax alto', 'trumpet':'tromba', 'trombone':'trombone',
  'percussion':'percussioni', 'harmonica':'armonica', 'flute':'flauto', 'double bass':'contrabbasso', 'strings':'archi', 'horn':'corno', 'clarinet':'clarinetto' };
const wdTime = v => v && v.time ? v.time.replace(/^\+/, '').slice(0, v.precision >= 11 ? 10 : v.precision === 10 ? 7 : 4) : '';
function wtTemplate(text, nameRe){
  const m = new RegExp('\\{\\{\\s*(?:' + nameRe + ')\\s*[|\\n}]', 'i').exec(text); if(!m) return '';
  let depth = 0;
  for(let k = m.index; k < text.length - 1; k++){
    if(text[k] === '{' && text[k + 1] === '{'){ depth++; k++; }
    else if(text[k] === '}' && text[k + 1] === '}'){ depth--; k++; if(depth === 0) return text.slice(m.index + 2, k - 1); }
  }
  return '';
}
function wtParams(inner){
  const parts = []; let cur = '', d1 = 0, d2 = 0;
  for(let k = 0; k < inner.length; k++){
    const two = inner.substr(k, 2);
    if(two === '{{'){ d1++; cur += two; k++; continue; } if(two === '}}'){ d1--; cur += two; k++; continue; }
    if(two === '[['){ d2++; cur += two; k++; continue; } if(two === ']]'){ d2--; cur += two; k++; continue; }
    if(inner[k] === '|' && !d1 && !d2){ parts.push(cur); cur = ''; continue; }
    cur += inner[k];
  }
  parts.push(cur);
  const o = {}; parts.slice(1).forEach(p=>{ const i = p.indexOf('='); if(i > 0) o[p.slice(0, i).trim().toLowerCase()] = p.slice(i + 1).trim(); });
  return o;
}
function wtClean(v){
  v = String(v || '').replace(/<!--[\s\S]*?-->/g, '').replace(/<ref[^>]*\/>/gi, '').replace(/<ref[\s\S]*?<\/ref>/gi, '').replace(/<br\s*\/?>/gi, ', ');
  v = v.replace(/\[\[(?:[^|\]]*\|)?([^\]]+)\]\]/g, '$1');   // i link prima dei modelli: [[Pagina|Nome]] contiene un '|' che spezzerebbe le liste
  for(let i = 0; i < 12 && /\{\{[^{}]*\}\}/.test(v); i++){
    v = v.replace(/\{\{([^{}]*)\}\}/g, (all, inner)=>{
      const p = inner.split('|').map(x=>x.trim()), n = (p[0] || '').toLowerCase();
      if(/^(start date|release date|end date|film date)/.test(n)){ const nums = p.slice(1).filter(x=>/^\d+$/.test(x)); return nums.length ? nums.slice(0, 3).map((x, i)=>i ? x.padStart(2, '0') : x).join('-') : ''; }
      if(n === 'duration'){ const g = k => (p.find(x=>x.startsWith(k + '=')) || '').split('=')[1]; const m = g('m'), s = g('s'); return m ? m + ':' + String(s || '0').padStart(2, '0') : ''; }
      if(/^(hlist|flatlist|plainlist|ubl|unbulleted list|flat list|plain list|nowrap|small)/.test(n)) return p.slice(1).filter(x=>!/^\w+\s*=/.test(x)).join(', ');
      return '';
    });
  }
  v = v.replace(/\[\[(?:[^|\]]*\|)?([^\]]+)\]\]/g, '$1').replace(/'{2,}/g, '').replace(/^\s*\*\s*/gm, ', ').replace(/\n+/g, ' ');
  return v.replace(/\s*,\s*(,\s*)+/g, ', ').replace(/^[\s,]+|[\s,]+$/g, '').replace(/\s+/g, ' ').trim();
}
function ibDateText(v){
  const s = wtClean(v); if(!s) return '';
  if(LANG !== 'it') return s;
  return s.replace(/\b(January|February|March|April|May|June|July|August|September|October|November|December)\b/g, m=>new Date(2000, EN_MONTHS.indexOf(m.toLowerCase()), 15).toLocaleDateString('it-IT', { month: 'long' }));
}
const ibList = v => wtClean(v).split(/\s*,\s*/).filter(Boolean);
function roleOf(type){
  type = String(type || '').toLowerCase();
  if(type === 'producer' || type === 'executive producer' || type === 'co-producer') return 'prod';
  if(type === 'mix' || type === 'mixer' || type === 'mix-dj') return 'mix';
  if(type === 'mastering') return 'master';
  if(/engineer|recording|audio|sound|balance|editor|programming/.test(type)) return 'eng';
  if(/instrument|vocal|performer|performing orchestra|conductor|chorus master|concertmaster/.test(type)) return 'perf';
  if(/arranger|orchestrator/.test(type)) return 'arr';
  if(/design|photograph|illustration|art direction|artwork|graphic/.test(type)) return 'art';
  if(/liner notes/.test(type)) return 'notes';
  return 'other';
}
function roleDetail(rel){
  const at = (rel.attributes || []).filter(a=>!/^(additional|assistant|co|executive|guest|solo|minor)$/i.test(a));
  let d = at.join(', ');
  if(!d && /vocal/i.test(rel.type)) d = 'vocal';
  if(LANG === 'it') d = d.split(', ').map(x=>INSTR_IT[x.toLowerCase()] || x).join(', ');
  if(/assistant/i.test((rel.attributes || []).join(' '))) d = (d ? d + ', ' : '') + (LANG === 'en' ? 'assistant' : 'assistente');
  return d;
}
function relCredits(rels, trackNo, into){
  (rels || []).forEach(rel=>{
    if(rel['target-type'] !== 'artist' || !rel.artist) return;
    const r = roleOf(rel.type), det = roleDetail(rel), key = r + '|' + (rel.artist.id || norm(rel.artist.name)) + '|' + det;
    let c = into.get(key);
    if(!c){ c = { r, d: det, n: rel.artist.name, id: rel.artist.id || '', tr: [] }; into.set(key, c); }
    if(trackNo && !c.tr.includes(trackNo)) c.tr.push(trackNo);
  });
}
function mediaSummary(media){ const m = new Map(); (media || []).forEach(x=>{ const f = x.format || '?'; m.set(f, (m.get(f) || 0) + 1); }); return [...m.entries()].map(([f, n])=>(n > 1 ? n + '× ' : '') + f).join(' + '); }
async function wikiInfobox(title){
  const j = await jget(`https://en.wikipedia.org/w/api.php?action=parse&page=${encodeURIComponent(title)}&prop=wikitext&section=0&redirects=1&format=json&origin=*`);
  const text = j && j.parse && j.parse.wikitext && (j.parse.wikitext['*'] || j.parse.wikitext);
  if(!text || typeof text !== 'string') return null;
  const box = wtTemplate(text, 'Infobox album'); if(!box) return null;
  const p = wtParams(box), out = {};
  if(p.recorded) out.recorded = ibDateText(p.recorded);
  if(p.studio) out.studio = ibList(p.studio).slice(0, 4);
  const sg = wtTemplate(text, 'Singles');
  if(sg){ const q = wtParams(sg); out.singles = Object.keys(q).filter(k=>/^single\d+$/.test(k)).sort((a, b)=>parseInt(a.slice(6), 10) - parseInt(b.slice(6), 10)).map(k=>wtClean(q[k]).replace(/^"|"$/g, '')).filter(Boolean).slice(0, 8); }
  return out;
}

/* ---------- artista: come nell'app dei dischi, e di più ---------- */
const LINKS = [['official homepage', 'Sito ufficiale'], [/instagram\.com/, 'Instagram'], [/facebook\.com/, 'Facebook'], [/(twitter|x)\.com/, 'X'], [/youtube\.com|youtu\.be/, 'YouTube'], [/tiktok\.com/, 'TikTok'], [/bandcamp\.com/, 'Bandcamp'], [/soundcloud\.com/, 'SoundCloud'],
  [/discogs\.com/, 'Discogs'], [/allmusic\.com/, 'AllMusic'], [/last\.fm/, 'Last.fm'], [/setlist\.fm/, 'Setlist.fm'], [/songkick\.com/, 'Songkick'], [/genius\.com/, 'Genius'], [/rateyourmusic\.com/, 'Rate Your Music'], [/imdb\.com/, 'IMDb']];
function linkName(type, u){ for(const [k, n] of LINKS){ if(typeof k === 'string' ? type === k : k.test(u)) return n; } return ''; }
function mergePeople(l){ const m = new Map(); l.forEach(p=>{ const c = m.get(p.n) || { n: p.n, roles: new Set(), yrs: [], cur: false, orig: false }; p.role.split(', ').filter(Boolean).forEach(r=>c.roles.add(r)); if(p.yrs) c.yrs.push(p.yrs); c.cur = c.cur || p.cur; c.orig = c.orig || p.orig; m.set(p.n, c); });
  return [...m.values()].map(c=>({ n: c.n, role: [...c.roles].join(', '), yrs: c.yrs.join(', '), cur: c.cur, orig: c.orig })); }
function parseMbArtist(j){
  const ls = j['life-span'] || {}, o = { type: j.type || '', begin: ls.begin || '', end: ls.end || '', area: (j.area || {}).name || '', from: (j['begin-area'] || {}).name || '', members: [], bands: [], support: [], links: [] };
  const role = r => (r.attributes || []).filter(a=>!/^(original|founder|minor|additional|guest|solo)$/i.test(a)).map(a=>INSTR_IT[a.toLowerCase()] || a).join(', ');
  const yrs = r => { const b = String(r.begin || '').slice(0, 4), e = String(r.end || '').slice(0, 4); return b || e ? `${b || '?'}–${e}` : ''; };
  for(const r of j.relations || []){
    if(r['target-type'] === 'artist' && r.artist){
      const p = { n: r.artist.name, role: role(r), yrs: yrs(r), cur: !r.ended && !r.end, orig: (r.attributes || []).some(a=>/^(original|founder)$/i.test(a)) };
      if(r.type === 'member of band') (r.direction === 'backward' ? o.members : o.bands).push(p);
      else if(/supporting musician/.test(r.type) && r.direction === 'backward') o.support.push(p);
    } else if(r['target-type'] === 'url' && r.url && r.url.resource){ const n = linkName(r.type, r.url.resource); if(n && !o.links.some(x=>x.n === n)) o.links.push({ n, u: r.url.resource }); }
  }
  o.members = mergePeople(o.members).sort((a, b)=>(b.cur - a.cur) || (b.orig - a.orig)); o.bands = mergePeople(o.bands); o.support = mergePeople(o.support).slice(0, 14);
  o.links.sort((a, b)=>(a.n === 'Sito ufficiale' ? -1 : 0) - (b.n === 'Sito ufficiale' ? -1 : 0));
  return o;
}
async function wikiIntro(sl){
  for(const [k, lang] of [['itwiki', 'it'], ['enwiki', 'en']]){
    const t = sl && sl[k] && sl[k].title; if(!t) continue;
    try{ const j = await jget(`https://${lang}.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=1&explaintext=1&redirects=1&format=json&origin=*&titles=${enc(t)}`);
      const pg = Object.values((j.query && j.query.pages) || {})[0], tx = pg && pg.extract && pg.extract.trim();
      if(tx && tx.length > 80) return { text: tx, lang, url: `https://${lang}.wikipedia.org/wiki/${enc(t.replace(/ /g, '_'))}` }; }catch(e){}
  }
  return null;
}
async function artistOnline(A){
  const key = 'art3:' + A.k, c = await dget(key); if(c && Date.now() - c.at < 60 * 864e5) return c;

    try{

      if(!hit) continue;
      const x = ents[hit]; out.qid = hit;
      const img = claimVal(x, 'P18'); if(img) out.img = 'https://commons.wikimedia.org/wiki/Special:FilePath/' + enc(img) + '?width=320';

      const ids = [...new Set(Object.values(R).flat())], labs = ids.length ? await wdEntities(ids) : {};
      Object.entries(R).forEach(([k, l])=>{ out[k] = l.map(q=>wdLabel(labs[q])).filter(Boolean); });
      out.awTotal = claimIds(x, 'P166').length; out.nomTotal = claimIds(x, 'P1411').length;
      const site = claimVal(x, 'P856'); if(site && /^https?:/.test(site)) out.site = site;

    }catch(err){}
  }
  if(out.mbid){ try{ out.mb = parseMbArtist(await mbget(`artist/${out.mbid}?inc=artist-rels+url-rels&fmt=json`)); }catch(err){} }
  await dset(key, out); return out;
}

function csvRows(text){ const first = text.split(/\r?\n/)[0] || '', sep = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',', rows = []; let r = [], c = '', q = false;

const hashS = t => { let h = 5381; for(let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return (h >>> 0).toString(36) + '-' + t.length; };

  if(btn){ btn.disabled = true; btn.textContent = 'Scarico il traduttore di Chrome…'; }
  return p.then(()=>{ toast('Traduttore di Chrome attivo: traduzioni illimitate, anche offline'); if(after) after(); }).catch(()=>{ if(btn){ btn.disabled = false; btn.textContent = 'Riprova ad attivare il traduttore di Chrome'; } toast('Chrome non è riuscito a scaricare il traduttore'); });

const trEmail = () => { try{ return (localStorage.getItem('tr-email') || '').trim(); }catch(e){ return ''; } };
async function translateIt(text){
  text = String(text || '').trim(); if(!text) return '';
  const key = 'tr1:' + hashS(text), c = await dget(key); if(c && c.t) return c.t;
  let out = '';

      const em = trEmail(), j = await jget('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(part.trim()) + '&langpair=en|it' + (em ? '&de=' + encodeURIComponent(em) : ''));   // con l'email il limite gratuito è 10 volte più alto
      const t = j && j.responseData && j.responseData.translatedText;
      if(!t || (j.responseStatus && +j.responseStatus !== 200) || /MYMEMORY WARNING|QUERY LENGTH LIMIT|INVALID/i.test(t)) throw new Error('limite');
